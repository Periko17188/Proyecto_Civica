# dbt_project.yml — Configuración principal del proyecto
# ============================================================================
# Aquí definimos rutas, entornos, materializaciones y destino de los modelos.
# El proyecto usa Bronze, Silver y Gold en Snowflake.
# La variable DBT_ENVIRONMENTS decide si apunta a DEV, PRE o PRO.

name: 'proyecto_civica'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
docs-paths: ["docs"]

target-path: "target"

clean-targets:
  - "target"
  - "dbt_packages"


# CONFIGURACIÓN DE MODELOS

models:
  +transient: false

  proyecto_civica:

    # ------------------------------------------------------------------------
    # SILVER
    # Modelos de limpieza y normalización.
    # Se materializan como vistas.
    # ------------------------------------------------------------------------
    silver:
      +database: "{{ env_var('DBT_ENVIRONMENTS', 'FAIL') }}_SILVER_DB"
      +schema: SQL_DATOS

      staging:
        +materialized: view
        +tags: ["silver", "staging"]

      core:
        +materialized: view
        +tags: ["silver", "core"]

    # ------------------------------------------------------------------------
    # GOLD
    # Modelos finales para análisis y Power BI.
    # Se materializan como tablas.
    # ------------------------------------------------------------------------
    gold:
      +database: "{{ env_var('DBT_ENVIRONMENTS', 'FAIL') }}_GOLD_DB"
      +schema: SQL_DATOS
      +materialized: table
      +tags: ["gold"]


# CONFIGURACIÓN DE SNAPSHOTS

snapshots:
  +transient: false
  +target_database: "{{ env_var('DBT_ENVIRONMENTS', 'FAIL') }}_SILVER_DB"
  +target_schema: snapshots


# CONFIGURACIÓN DE TESTS

tests:
  +store_failures: false
  +severity: error